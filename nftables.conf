#!/usr/sbin/nft -f
#
# Transparent proxy capture for xray. Two hooks:
#
#   prerouting  traffic from the LAN and from containers, tproxy'd at xray
#   output      traffic this host generates itself, marked so the ip rule
#               loops it back round to prerouting
#
# ⚠ The single most important rule in this file is `meta skuid $XRAY_USER
#   return` in the output chain. Without it xray's OWN outgoing connections
#   are captured by the very inbound that emitted them: a dial to a node comes
#   straight back in and is dispatched a second time, and the DNS module ends
#   up answering its own upstream queries out of its own cache. The symptom is
#   a log that is 90% `cache HIT ... empty response` and a resolver that never
#   reaches an upstream at all.
#
#   The outbounds also carry fwmark 2 and `meta mark 2 return` catches those,
#   but that only works for protocols whose dialer honours sockopt. This rule
#   does not care: it matches the socket's owner, so it holds for hysteria's
#   own QUIC dialer and for any outbound somebody adds later and forgets to
#   mark. Belt and braces, and the braces are the uid.

flush ruleset

define XRAY_USER = "xray"     # must match User= in systemd/xray.service
define TPROXY_PORT = 12345    # must match the all-in inbound in 00-inbounds.json
# Never captured, in either direction. Two separate jobs:
#
#   inbound   a connection arriving on a public interface matches neither
#             RESERVED_IP nor 192.168.0.0/16, so without the exemption it falls
#             through to the tproxy rule and is handed to the transparent door
#             instead of to the listener it was addressed to.
#   outbound  a connection this host MAKES to one of these ports must not be
#             marked either, or it is routed to lo and then refused by
#             prerouting, which is a silent drop. See the output chain.
#
# So these ports always go direct, both ways. Taking 22 out to proxy outgoing
# ssh would also stop protecting inbound ssh, which is a good way to lock
# yourself out of a remote box.
#   22    ssh
#   2080  the socks/http inbound, which defaults to 0.0.0.0
#   8585  --vless-listen, if you turned it on
define KEEP_DIRECT_PORTS = { 22, 2080, 8585 }

# Destinations that must never be sent to the proxy. 192.168.0.0/16 is
# deliberately NOT here - LAN traffic is let through below, but LAN *DNS* is
# still captured, which is the point of intercepting port 53 at all.
define RESERVED_IP = {
    10.0.0.0/8,
    100.64.0.0/10,
    127.0.0.0/8,
    169.254.0.0/16,
    172.16.0.0/12,
    192.0.0.0/24,
    224.0.0.0/4,
    240.0.0.0/4,
    255.255.255.255/32
}

table ip xray {
    # The exceptions and the capture, written once. Reached with `goto`, never
    # `jump`: after a goto'd chain returns, evaluation resumes at the BASE
    # chain's policy rather than at the next rule of the caller. With `jump` a
    # `return` here would fall back into the calling chain and hit a second
    # copy of the same tproxy rules - which is what the duplicated
    # prerouting/proxy_mark blocks used to do.
    chain proxy_mark {
        ip daddr $RESERVED_IP return
        tcp dport $KEEP_DIRECT_PORTS return
        udp dport $KEEP_DIRECT_PORTS return
        # The LAN goes direct, except its DNS.
        ip daddr 192.168.0.0/16 tcp dport != 53 return
        ip daddr 192.168.0.0/16 udp dport != 53 return

        ip protocol tcp tproxy to 127.0.0.1:$TPROXY_PORT meta mark set 1
        ip protocol udp tproxy to 127.0.0.1:$TPROXY_PORT meta mark set 1
    }

    chain prerouting {
        # raw priority: ahead of Docker's NAT, so container traffic is seen
        # with its original destination rather than a translated one. That is
        # also why no per-interface rule is needed for docker0 or the br-*
        # bridges - everything they hand up arrives here, and proxy_mark's
        # RESERVED_IP line already excuses container-to-container traffic.
        type filter hook prerouting priority raw; policy accept;
        goto proxy_mark
    }

    chain output {
        type route hook output priority mangle; policy accept;

        # ⚠ FIRST. See the header. Everything xray sends leaves untouched;
        # without this the proxy captures itself.
        meta skuid $XRAY_USER return
        # The same guarantee expressed in the config, for outbounds whose
        # dialer honours sockopt. Redundant with the line above by design.
        meta mark 2 return

        ip daddr $RESERVED_IP return
        # Replies from a listener of ours, so an inbound ssh session is not
        # marked and looped.
        tcp sport $KEEP_DIRECT_PORTS return
        udp sport $KEEP_DIRECT_PORTS return
        # ⚠ And the same ports by DESTINATION, which is not symmetry for its own
        # sake. Anything marked here is routed to lo by the fwmark rule and
        # comes back round to prerouting - where proxy_mark returns on these
        # same ports and declines to tproxy it. The routing decision to deliver
        # locally has already been made by then and nothing is listening for
        # the remote address, so the packet is simply dropped.
        #
        # That is a black hole, not a fallback: `git pull` over ssh sat there
        # until it timed out, with no log line anywhere. Whatever prerouting
        # will not tproxy, output must not mark.
        tcp dport $KEEP_DIRECT_PORTS return
        udp dport $KEEP_DIRECT_PORTS return
        ip daddr 192.168.0.0/16 tcp dport != 53 return
        ip daddr 192.168.0.0/16 udp dport != 53 return

        # No tproxy in output - you cannot tproxy a locally generated packet.
        # Marking it makes `ip rule fwmark 1` send it to table 100, whose local
        # default route turns it round into prerouting, where tproxy can act.
        ip protocol tcp meta mark set 1
        ip protocol udp meta mark set 1
    }
}
